<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="centralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#centralAura)" />

  <!-- Outer Floating Orbit Rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="8 12" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="6 8" />
  
  <!-- Central Glass Hexagon / Shield -->
  <polygon points="250,70 400,155 400,345 250,430 100,345 100,155" fill="#0d1428" stroke="url(#neonCyanPurple)" stroke-width="2.5" opacity="0.9" />

  <!-- Inner Tech Nodes & Grid -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1">
    <line x1="250" y1="70" x2="250" y2="430" />
    <line x1="100" y1="155" x2="400" y2="345" />
    <line x1="100" y1="345" x2="400" y2="155" />
  </g>

  <!-- Central Core Badge -->
  <circle cx="250" cy="250" r="68" fill="#141e38" stroke="#00f0ff" stroke-width="2" />
  
  <!-- Code Brackets & Dev Icon in Center -->
  <path d="M 230 225 L 210 250 L 230 275" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 270 225 L 290 250 L 270 275" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="258" y1="220" x2="242" y2="280" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Floating Tech Orbs -->
  <!-- React Orb -->
  <g transform="translate(100, 155)">
    <circle cx="0" cy="0" r="28" fill="#0b1329" stroke="#00d8ff" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.5" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#00d8ff" stroke-width="1.5" transform="rotate(120)" />
    <circle cx="0" cy="0" r="2.5" fill="#00d8ff" />
  </g>

  <!-- Java / Backend Orb -->
  <g transform="translate(400, 155)">
    <circle cx="0" cy="0" r="28" fill="#0b1329" stroke="#f97316" stroke-width="2" />
    <path d="M -8 -6 C -8 -6 -3 -12 3 -12 C 9 -12 1 -6 3 2 C 5 10 -8 12 0 16" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" />
    <path d="M -11 5 C -11 5 -12 9 8 9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- JS / Frontend Orb -->
  <g transform="translate(400, 345)">
    <circle cx="0" cy="0" r="28" fill="#0b1329" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="7" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">JS</text>
  </g>

  <!-- ML / Python Orb -->
  <g transform="translate(100, 345)">
    <circle cx="0" cy="0" r="28" fill="#0b1329" stroke="#8b5cf6" stroke-width="2" />
    <text x="0" y="6" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">&lt;AI&gt;</text>
  </g>

  <!-- Top Status Indicator -->
  <g transform="translate(250, 70)">
    <circle cx="0" cy="0" r="22" fill="#0b1329" stroke="#10b981" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#10b981" />
  </g>

  <!-- Bottom Fast Track Indicator -->
  <g transform="translate(250, 430)">
    <circle cx="0" cy="0" r="22" fill="#0b1329" stroke="#00f0ff" stroke-width="2" />
    <polygon points="-5,-6 6,0 -5,6" fill="#00f0ff" />
  </g>
</svg>
