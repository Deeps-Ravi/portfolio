<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24050b" />
      <stop offset="50%" stop-color="#3b0813" />
      <stop offset="100%" stop-color="#190307" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#e6ca65" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A0F1B" />
      <stop offset="100%" stop-color="#801526" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f070f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a0408" stop-opacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" fill="url(#bgMaroon)" />

  <!-- Ambient Maroon & Soft Gold Glow -->
  <circle cx="180" cy="120" r="140" fill="#5A0F1B" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="640" cy="320" r="120" fill="#c9a227" opacity="0.15" filter="url(#softGlow)" />

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Browser Frame -->
  <g transform="translate(60, 35)">
    <rect width="680" height="380" rx="12" fill="#1b0408" stroke="rgba(201, 162, 39, 0.25)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="680" height="40" rx="12" fill="#2d070f" />
    <rect y="28" width="680" height="12" fill="#2d070f" />
    <line x1="0" y1="40" x2="680" y2="40" stroke="rgba(255,255,255,0.08)" />

    <!-- Window Dots -->
    <circle cx="24" cy="20" r="5" fill="#e11d48" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />

    <!-- Search Address Bar -->
    <rect x="110" y="8" width="460" height="24" rx="6" fill="#140306" stroke="rgba(255,255,255,0.08)" />
    <text x="135" y="24" fill="#e2d9da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://mgvs-realestate.web.app</text>
    <rect x="530" y="12" width="30" height="16" rx="3" fill="#5A0F1B" />
    <text x="536" y="24" fill="#c9a227" font-family="sans-serif" font-size="9" font-weight="bold">LIVE</text>

    <!-- App Header -->
    <g transform="translate(25, 55)">
      <rect width="28" height="28" rx="6" fill="url(#maroonGrad)" stroke="rgba(201, 162, 39, 0.4)" stroke-width="1" />
      <text x="8" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">M</text>
      <text x="36" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">MGVS <tspan fill="#c9a227" font-weight="600">Real Estate</tspan></text>
      
      <text x="360" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="500">Properties</text>
      <text x="430" y="18" fill="#d1c4c6" font-family="sans-serif" font-size="11">Featured</text>
      <text x="490" y="18" fill="#d1c4c6" font-family="sans-serif" font-size="11">About</text>
      <rect x="545" y="4" width="85" height="24" rx="12" fill="url(#goldAccent)" />
      <text x="562" y="19" fill="#24050b" font-family="sans-serif" font-size="10" font-weight="bold">Inquire Now</text>
    </g>

    <!-- App Hero Banner -->
    <g transform="translate(25, 98)">
      <rect width="630" height="100" rx="8" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="25" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Find Your Ideal Property with MGVS</text>
      <text x="25" y="58" fill="#d5c7c9" font-family="sans-serif" font-size="11">Providing modern responsive property listings &amp; transparent business details.</text>
      
      <!-- Filter Bar -->
      <rect x="25" y="70" width="370" height="20" rx="4" fill="#0d0204" stroke="rgba(201, 162, 39, 0.2)" />
      <text x="35" y="84" fill="#99888b" font-family="sans-serif" font-size="9">🔍 Search location, price, property type...</text>
      <rect x="340" y="72" width="50" height="16" rx="3" fill="#5A0F1B" />
      <text x="351" y="83" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold">Filter</text>
    </g>

    <!-- Property Listings Grid in Mockup -->
    <g transform="translate(25, 215)">
      <!-- Card 1 -->
      <g>
        <rect width="198" height="142" rx="8" fill="#24060c" stroke="rgba(255,255,255,0.06)" />
        <rect x="8" y="8" width="182" height="70" rx="6" fill="#350811" />
        <path d="M 99 24 L 60 56 L 138 56 Z" fill="#c9a227" opacity="0.8" />
        <rect x="75" y="54" width="48" height="22" fill="#190307" />
        <rect x="88" y="62" width="22" height="14" fill="#5A0F1B" />
        <rect x="14" y="14" width="52" height="15" rx="3" fill="#5A0F1B" />
        <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold">RESIDENTIAL</text>
        
        <text x="12" y="98" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Luxury Palm Villa</text>
        <text x="12" y="112" fill="#baa9ac" font-family="sans-serif" font-size="9">Chennai, Tamil Nadu</text>
        <text x="12" y="132" fill="#c9a227" font-family="sans-serif" font-size="12" font-weight="bold">₹ 85,00,000</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(216, 0)">
        <rect width="198" height="142" rx="8" fill="#24060c" stroke="rgba(255,255,255,0.06)" />
        <rect x="8" y="8" width="182" height="70" rx="6" fill="#350811" />
        <rect x="80" y="24" width="38" height="50" fill="#5A0F1B" opacity="0.9" />
        <rect x="85" y="28" width="7" height="6" fill="#c9a227" />
        <rect x="96" y="28" width="7" height="6" fill="#c9a227" />
        <rect x="107" y="28" width="7" height="6" fill="#c9a227" />
        <rect x="14" y="14" width="58" height="15" rx="3" fill="#350811" stroke="rgba(201,162,39,0.3)" stroke-width="1" />
        <text x="20" y="25" fill="#c9a227" font-family="sans-serif" font-size="8" font-weight="bold">COMMERCIAL</text>

        <text x="12" y="98" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">TechPark Office</text>
        <text x="12" y="112" fill="#baa9ac" font-family="sans-serif" font-size="9">Anna University Zone</text>
        <text x="12" y="132" fill="#c9a227" font-family="sans-serif" font-size="12" font-weight="bold">₹ 1,20,00,000</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(432, 0)">
        <rect width="198" height="142" rx="8" fill="#24060c" stroke="rgba(255,255,255,0.06)" />
        <rect x="8" y="8" width="182" height="70" rx="6" fill="#350811" />
        <rect x="70" y="22" width="58" height="52" fill="#801526" opacity="0.8" />
        <line x1="70" y1="38" x2="128" y2="38" stroke="#190307" stroke-width="2" />
        <line x1="70" y1="54" x2="128" y2="54" stroke="#190307" stroke-width="2" />
        <rect x="14" y="14" width="48" height="15" rx="3" fill="#5A0F1B" />
        <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold">FEATURED</text>

        <text x="12" y="98" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Sunrise Apartments</text>
        <text x="12" y="112" fill="#baa9ac" font-family="sans-serif" font-size="9">Ranipet, Tamil Nadu</text>
        <text x="12" y="132" fill="#c9a227" font-family="sans-serif" font-size="12" font-weight="bold">₹ 52,00,000</text>
      </g>
    </g>
  </g>
</svg>
