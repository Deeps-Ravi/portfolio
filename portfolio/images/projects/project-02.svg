<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMaroon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24050b" />
      <stop offset="50%" stop-color="#3b0813" />
      <stop offset="100%" stop-color="#190307" />
    </linearGradient>
    <linearGradient id="goldAccent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#e6ca65" />
    </linearGradient>
    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" fill="url(#bgMaroon2)" />
  <circle cx="200" cy="150" r="130" fill="#5A0F1B" opacity="0.4" filter="url(#softGlow2)" />
  <circle cx="600" cy="300" r="100" fill="#c9a227" opacity="0.12" filter="url(#softGlow2)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Card Frame -->
  <g transform="translate(100, 60)">
    <rect width="600" height="330" rx="16" fill="#1d0409" stroke="rgba(201, 162, 39, 0.2)" stroke-width="1.5" />
    
    <!-- Header bar -->
    <rect width="600" height="40" rx="16" fill="#2d070f" />
    <rect y="26" width="600" height="14" fill="#2d070f" />
    <circle cx="25" cy="20" r="5" fill="#ff5f56" />
    <circle cx="45" cy="20" r="5" fill="#ffbd2e" />
    <circle cx="65" cy="20" r="5" fill="#27c93f" />
    <text x="300" y="25" fill="#d0c2c5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Project 02 &bull; Under Development</text>

    <!-- Center Icon & Text -->
    <g transform="translate(300, 150)">
      <circle cx="0" cy="0" r="45" fill="#350811" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4" />
      <!-- Code / AI Icon -->
      <path d="M-15,-8 L-25,0 L-15,8 M15,-8 L25,0 L15,8 M-6,14 L6,-14" stroke="#c9a227" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <text x="0" y="70" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Python &amp; ML Project</text>
      <text x="0" y="98" fill="#d0c2c5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">Data-Driven Machine Learning Pipeline</text>
    </g>

    <!-- Badges -->
    <g transform="translate(180, 280)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#350811" stroke="rgba(255,255,255,0.1)" />
      <text x="35" y="16" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Python</text>
      
      <rect x="80" y="0" width="85" height="24" rx="12" fill="#350811" stroke="rgba(255,255,255,0.1)" />
      <text x="122" y="16" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Scikit-Learn</text>

      <rect x="175" y="0" width="65" height="24" rx="12" fill="#350811" stroke="rgba(255,255,255,0.1)" />
      <text x="207" y="16" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Datasets</text>
    </g>
  </g>
</svg>
